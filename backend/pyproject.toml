[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "topico-csj-backend"
version = "0.1.0"
description = "Backend del Sistema Integral de Gestión de Atención del Tópico de Salud — CSJ Lima"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.35,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "jinja2>=3.1",
    "structlog>=24.4",
    "slowapi>=0.1.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "aiosmtpd>=1.4",
    "types-openpyxl",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 120
markers = [
    "db: requiere la base de datos PostgreSQL de pruebas",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "PT"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # tildes y signos del español en textos
    "E501",                         # el formateador controla el largo; se permiten textos largos en español
    "S101",                         # assert para invariantes del dominio
    "S105",                         # falsos positivos ("bearer", nombres de campos)
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S311", "S106"]
"alembic/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
